[project]
name = "caldera-demo"
version = "0.1.0"
description = "Caldera planning demo — drivers in, plan out, every number traceable to the inputs that made it (DuckDB, dlt, SQLMesh)"
requires-python = ">=3.12"
dependencies = [
    "sqlmesh[duckdb]",
    "dlt[duckdb]",
    "duckdb",
    "flask>=3.1.3",
    "chassis",
]

[tool.uv.sources]
chassis = { path = "99_core_clones/chassis-0.2.0-py3-none-any.whl" }

[tool.uv]
package = false
