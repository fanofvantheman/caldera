name: pipeline

# The end-to-end trigger: generate → ingest → plan. Actions runs and never commits — this repository is a
# projection. A fresh runner regenerates the synthetic client from the recipe, loads it, evaluates every model
# and every check, and prints what the room would read.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Generate the synthetic client
        run: uv run python -m generate
      - name: Load the landing (dlt → bronze)
        run: uv run python -m ingest.pipeline
      - name: Plan and apply (every model, every check)
        run: uv run sqlmesh plan prod --auto-apply --no-prompts
      - name: Verify — structures, calendar, roles, history
        run: |
          uv run python - <<'EOF'
          import duckdb
          c = duckdb.connect('data/caldera.duckdb', read_only=True)
          show = lambda title, sql: (print(title), [print("  ", r) for r in c.sql(sql).fetchall()])
          show("calendar:", "select fiscal_year, count(*) weeks_n, count(distinct period) periods_n from dims.dim_week group by 1 order by 1")
          show("period position:", "select period, period_state from dims.dim_period where is_current_period or is_latest_closed order by period")
          show("hierarchies reach root:", """select 'material' d, bool_and(reaches_root) ok from dims.dim_material_hierarchy
                                             union all select 'customer', bool_and(reaches_root) from dims.dim_customer_hierarchy
                                             union all select 'location', bool_and(reaches_root) from dims.dim_location_hierarchy
                                             union all select 'organisation', bool_and(reaches_root) from dims.dim_organisation_hierarchy""")
          show("entitlements by principal:", "select principal, count(distinct action) actions from dims.effective_entitlements group by 1 order by 1")
          show("history by fiscal year (k cases):", "select fiscal_year, round(sum(cases)/1e3) from history.shipments_period group by 1 order by 1")
          assert c.sql("select bool_and(reaches_root) from dims.dim_material_hierarchy").fetchone()[0]
          assert c.sql("select count(*) from dims.dim_period where is_current_period").fetchone()[0] == 1
          EOF
      - name: Verify — the demand plan and its financialisation
        run: |
          uv run python - <<'EOF'
          import duckdb
          c = duckdb.connect('data/caldera.duckdb', read_only=True)
          show = lambda title, sql: (print(title), [print("  ", r) for r in c.sql(sql).fetchall()])
          show("stack by version and layer (k cases, k$ net):", "select version_id, layer_no, layer_name, round(sum(cases)/1e3,1) kcases, round(sum(net_sales)/1e3) knet from plan.demand_financialised group by all order by 1,2")
          show("latest view by period, decomposed (k cases):", "select period, round(sum(cases)/1e3,1) total, round(sum(l1_baseline)/1e3,1) l1, round(sum(l2_adjustment)/1e3,1) l2, round(sum(l4_distribution)/1e3,1) l4, round(sum(l6_promotions)/1e3,1) l6, round(sum(l7_innovation)/1e3,1) l7, round(sum(l8_exit)/1e3,1) l8 from plan.unconstrained_demand_period where version_id like 'LV-%' group by 1 order by 1")
          show("gross to net, latest view (k$):", "select band, measure, round(sum(amount)/1e3) from plan.gross_to_net where version_id like 'LV-%' group by all order by min(case band when 'gross' then 0 when 'on_invoice' then 1 when 'volume_terms' then 2 when 'promotion' then 3 when 'service' then 4 when 'payment' then 5 when 'compliance' then 6 else 7 end), 2")
          show("gap to the business plan by account (k cases plan / reference, k$ net gap):", "select account_code, round(sum(plan_cases)/1e3), round(sum(reference_cases)/1e3), round(sum(net_sales_gap)/1e3) from plan.gap_to_reference group by 1 order by 1")
          show("one event traced through the grid:", "select line_source, effect_type, week_id, round(sum(cases)) from plan.demand_stack where line_source = (select min(event_id) from plan.promo_event) group by all order by 3,2")
          assert c.sql("select count(*) from plan.layer_entry e where not exists (select 1 from plan.demand_stack s where s.line_source = e.entry_id)").fetchone()[0] == 0, "an entry spread to nothing"
          assert c.sql("select count(*) from plan.demand_financialised where not priced").fetchone()[0] == 0
          EOF
